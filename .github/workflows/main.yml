name: Build and Deploy to Sandbox

on:
  push:
    branches: [ develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up JDK 1.8
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 8

      - name: Setup Maven settings with Anypoint credentials
        run: |
          mkdir -p ~/.m2
          cat <<EOF > ~/.m2/settings.xml
          <settings>
            <pluginGroups>
              <pluginGroup>org.mule.tools</pluginGroup>
            </pluginGroups>
            <servers>
              <server>
                <id>Repository</id>
                <username>${{ secrets.anypoint_platform_username }}</username>
                <password>${{ secrets.anypoint_platform_password }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Stamp artifact file name with commit hash
        run: |
          artifactName1=$(ls target/*.jar | head -1)
          commitHash=$(git rev-parse --short "$GITHUB_SHA")
          artifactName2=$(echo "$artifactName1" | sed "s/\.jar$/-$commitHash.jar/")
          mv "$artifactName1" "$artifactName2"

      - name: Upload artifact 
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: target/*.jar

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - uses: actions/download-artifact@v4
        with:
          name: artifacts

      - name: Setup Maven settings with Anypoint credentials
        run: |
          mkdir -p ~/.m2
          cat <<EOF > ~/.m2/settings.xml
          <settings>
            <pluginGroups>
              <pluginGroup>org.mule.tools</pluginGroup>
            </pluginGroups>
            <servers>
              <server>
                <id>Repository</id>
                <username>${{ secrets.anypoint_platform_username }}</username>
                <password>${{ secrets.anypoint_platform_password }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Deploy to Sandbox
        env:
          KEY: ${{ secrets.decryption_key }}
        run: |
          artifactName=$(ls *.jar | head -1)
          mvn deploy -DmuleDeploy \
            -Dmule.artifact="$artifactName" \
            -Ddecryption.key="$KEY"
